note: >-
  Two RevenueBase services behave differently and the difference is measured here
  rather than averaged away. The established v2 service (email, organization, jobs,
  account) returns a bare FastAPI {"detail": "..."} body as application/json. The
  newer contact-refresh service returns RFC 9457 application/problem+json with
  type/title/status/detail plus a request_id — observed live, not inferred. Treat
  rfc9457 as partial, not as a property of the API as a whole.
