note: >-
  RevenueBase serves a real .well-known discovery surface — but only on its
  documentation host. docs.revenuebase.ai answers 200 with genuine documents at
  /.well-known/agent-card.json (A2A), /.well-known/mcp.json (MCP endpoint
  discovery) and /.well-known/agent-skills/ (Agent Skills discovery index plus the
  skill itself). The marketing host (revenuebase.ai) and the API host
  (api.revenuebase.ai) serve nothing: every path 404s, and neither is a soft-200
  SPA catch-all — revenuebase.ai returns an explicit "Invalid .well-known request"
  404 page and api.revenuebase.ai returns {"detail":"Not Found"}. No security.txt
  is served anywhere. Absence is recorded here as valid data.
