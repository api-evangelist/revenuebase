aid: revenuebase
name: RevenueBase
description: >-
  RevenueBase is a B2B data infrastructure platform — "the trust layer for B2B
  data" — providing 390M+ continuously verified contacts and 60M+ companies
  delivered via Snowflake, S3, Gigasheet, or a REST API. Core capabilities include
  real-time and batch email verification, deterministic and semantic company
  matching/resolution, organization discovery, and record enrichment, with data
  filterable by headcount, revenue, funding stage, industry, job title, seniority,
  geography, and tech stack. The v2 REST API authenticates with an API key in the
  x-key header and meters usage in credits. Originally surfaced as a Bessemer
  Venture Partners portfolio company and enriched into the API Evangelist network.
