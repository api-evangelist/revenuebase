docs: https://docs.revenuebase.ai/api-reference/v2/rate-limits
format: mixed
envelope: >-
  RevenueBase runs TWO error envelopes, and which one you get depends on which
  service you call. The established v2 service (email, organization, jobs, account)
  is not RFC 9457: validation errors (422) return the FastAPI HTTPValidationError
  shape {"detail": [{"loc": [...], "msg": "...", "type": "..."}]}, and business
  errors (400/401/402) return application/json with a string detail/message plus,
  for some cases, a documented error-code string (invalid_extension, upload_error,
  already_cancelled, not_cancellable, not_completed, process_error). The newer
  contact-refresh service IS RFC 9457: it answers application/problem+json with
  type/title/status/detail and adds a request_id for tracing — observed live, see
  x-evidence.
envelopes:
- id: fastapi-detail
  media_type: application/json
  services:
  - Revenuebase API v2 (email, organization, jobs, account)
  shape: '{"detail": "..."} or {"detail": [{"loc": [...], "msg": "...", "type": "..."}]}'
  rfc9457: false
- id: rfc9457-problem
  media_type: application/problem+json
  services:
  - contact-refresh (POST /v2/contact/refresh/email)
  shape: '{"type": "about:blank", "title": "...", "status": 401, "detail": "...", "request_id": "..."}'
  rfc9457: true
  trace_field: request_id
status_codes:
- code: 400
  title: Bad Request
  meaning: Malformed request body, missing/invalid parameters, out-of-range values,
    or a job that does not belong to your account.
  codes:
  - invalid_extension
  - upload_error
  - already_cancelled
  - not_cancellable
  - not_completed
  - process_error
- code: 401
  title: Unauthorized
  meaning: Missing or invalid API key (x-key header).
- code: 402
  title: Payment Required
  meaning: Insufficient credits. Recharge the account before retrying.
  remediation: Check GET /v2/account/balance and top up credits.
- code: 403
  title: Forbidden
  meaning: Key is valid but not authorized for this endpoint.
- code: 404
  title: Not Found
  meaning: Endpoint or resource does not exist.
- code: 422
  title: Unprocessable Entity
  meaning: Request parsed correctly but failed field validation (HTTPValidationError).
  schema: HTTPValidationError
- code: 429
  title: Too Many Requests
  meaning: Rate limit exceeded for the API key. Email verify is limited to 5 req/sec.
  remediation: Read X-RateLimit-Reset before retrying.
- code: 500
  title: Internal Server Error
  meaning: Unexpected error on the RevenueBase side.
  remediation: Retry with backoff; contact support@revenuebase.ai if it persists.
