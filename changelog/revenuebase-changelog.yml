note: >-
  RevenueBase publishes a dated Release Notes page in its documentation. It is a
  DATA release log, not an API change log: each monthly entry leads with three
  quality statistics (email re-verification %, contact freshness %, company
  accuracy %) and then lists dataset scale, de-duplication work, bug fixes and
  fill-rate movements. API surface changes are not tracked there — the only
  platform-level API milestone RevenueBase documents is the v1 sunset. The
  official Python SDK carries its own semver release history on PyPI and a
  CHANGELOG.md in its repository; both are tracked below.
