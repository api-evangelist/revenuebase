api: Revenuebase API v2
scope: per-api-key
note: >-
  RevenueBase documents the runtime rate-limit SIGNAL fully (three response headers
  plus the exhaustion status code and a backoff recipe) but publishes only one
  numeric limit — 5 requests per second on single email verification. The
  rate-limits page states "Limits are applied per API key" without naming the
  window or ceiling for the other endpoints, so an integrator must read
  X-RateLimit-Limit at runtime to learn their own quota. Separately from rate
  limiting, every endpoint is metered in credits and returns 402 when the balance
  is insufficient (see plans/ and conventions/).
limit_count: 1
