note: >-
  RevenueBase's MCP surface and its REST surface do not overlap at all. The live MCP
  server at https://docs.revenuebase.ai/mcp is documentation-scoped: its three tools
  search and read the docs corpus and file docs feedback. None of them is backed by a
  REST operation, and none of the thirteen REST operations has an MCP tool. This is a
  complete surface divergence and it is the headline finding of this crosswalk: an
  agent connected to the RevenueBase MCP server can READ ABOUT the API but cannot
  CALL it. Every data operation requires a direct REST call with an x-key header.
