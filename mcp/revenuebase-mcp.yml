note: >-
  RevenueBase operates a live, anonymous, remote MCP server on its own
  documentation host. It is a DOCUMENTATION server, not a data-API server: the
  three tools search and read the RevenueBase docs corpus and file docs feedback.
  None of the v2 data operations (email verification, organization resolve/discover,
  batch jobs, account balance) are exposed as MCP tools — an agent that wants those
  must call the REST API directly with an x-key header. The server is branded
  RevenueBase (serverInfo.name "RevenueBase") and is Mintlify-provided infrastructure
  served from docs.revenuebase.ai; the .well-known/mcp.json document also lists the
  underlying Mintlify origin (revenuebase.main-kill-isr.mintlify.me/mcp) as the same
  server. The docs host also serves an A2A agent card (see a2a/) and an Agent Skills
  discovery index (see well-known/ and skills/).
server:
  name: RevenueBase
  version: 1.0.0
  transport: http
  url: https://docs.revenuebase.ai/mcp
  published: true
  protocol_version: '2025-06-18'
  auth: none
  capabilities:
    tools:
      listChanged: true
    resources:
      listChanged: true
  scope: documentation
deployment:
  mode: remote
  endpoint: https://docs.revenuebase.ai/mcp
  auth: none
  verified: probed
  checked: '2026-08-13'
  note: >-
    Remote HTTP endpoint an MCP client POSTs to directly. No stdio package, no npx
    install — RevenueBase publishes no local MCP server.
tools:
- name: search_revenue_base
  title: Search documentation
  description: >-
    Search across the RevenueBase knowledge base to find relevant information, code
    examples, API references, and guides.
  input_schema:
    query: string (required)
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: query_docs_filesystem_revenue_base
  description: >-
    Read-only shell-like query against a virtualized in-memory filesystem containing
    only the RevenueBase documentation pages and OpenAPI specs. Supports rg, grep,
    find, tree, ls, cat, head, tail, stat, wc, sort, uniq, cut, sed, awk, jq. No
    writes, no network, no process control. Stateless per call; output truncated to
    30KB.
  input_schema:
    command: string (required)
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: submit_feedback
  title: Submit documentation feedback
  description: Report a problem with a documentation page to the RevenueBase docs team.
  input_schema:
    path: string (required)
    feedback: string (required)
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
resources:
- uri: mintlify://skills/revenuebase
