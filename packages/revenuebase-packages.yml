note: >-
  RevenueBase ships one first-party server SDK (Python) and one first-party n8n
  community node. Its own docs say so plainly: the Developer SDK page lists Python
  only and offers a "Request a language" card pointing at developers@revenuebase.ai.
  Currency check as of 2026-08-13: the Python SDK's latest release (0.3.0,
  2026-07-16) postdates the v1 API sunset (2026-07-07) and is roughly a month old,
  so the SDK is tracking the API rather than lagging it. The npm n8n node was last
  published 2026-05-02 under the scoped name @revenuebase/n8n-nodes-revenuebase —
  note the unscoped name n8n-nodes-revenuebase used by the GitHub repository does
  NOT exist on npm (404), so anyone following the repo name alone will not find it.
  No JavaScript/TypeScript, Java, .NET, Go, Ruby, PHP or Rust client library is
  published for the REST API itself.
